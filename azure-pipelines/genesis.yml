trigger: none
pr: none

name: genesis-$(Date:yyyyMMdd)-$(Rev:r)

parameters:
  - name: environment
    displayName: Environment to create
    type: string
    default: dev
    values:
      - dev

  - name: confirm
    displayName: Type the environment name exactly to confirm
    type: string
    default: ""

variables:
  azureServiceConnection: sc-movieops-azure-wif
  terraformVersion: 1.9.8
  checkovImage: bridgecrew/checkov:3.2.495
  terraformWorkingDirectory: $(Build.SourcesDirectory)/terraform/environments/azure/${{ parameters.environment }}
  terraformPlanPath: $(Pipeline.Workspace)/genesis-${{ parameters.environment }}.tfplan

stages:
  - stage: Genesis
    displayName: Create ${{ parameters.environment }} infrastructure
    jobs:
      - deployment: TerraformApply
        displayName: Terraform plan and apply
        environment: ${{ parameters.environment }}
        timeoutInMinutes: 90
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none

                - bash: |
                    set -euo pipefail
                    if [[ "$GENESIS_CONFIRM" != "$GENESIS_ENVIRONMENT" ]]; then
                      echo "##vso[task.logissue type=error]Confirmation does not match environment '$GENESIS_ENVIRONMENT'."
                      exit 1
                    fi
                    echo "Typed confirmation accepted for '$GENESIS_ENVIRONMENT'."
                  displayName: Verify typed confirmation
                  env:
                    GENESIS_CONFIRM: ${{ parameters.confirm }}
                    GENESIS_ENVIRONMENT: ${{ parameters.environment }}
                  workingDirectory: $(Pipeline.Workspace)

                - checkout: self
                  displayName: Checkout exact GitHub commit
                  fetchDepth: 1
                  persistCredentials: false

                - bash: |
                    set -euo pipefail
                    test -f main.tf
                    test -f backend.tf
                    test -f .terraform.lock.hcl
                    echo "Terraform environment '${{ parameters.environment }}' exists."
                  displayName: Verify Terraform environment
                  workingDirectory: $(terraformWorkingDirectory)

                - task: TerraformInstaller@1
                  displayName: Install Terraform $(terraformVersion)
                  inputs:
                    terraformVersion: $(terraformVersion)

                - bash: terraform fmt -check -recursive terraform
                  displayName: Terraform fmt
                  workingDirectory: $(Build.SourcesDirectory)

                - task: AzureCLI@2
                  displayName: Terraform init with Azure WIF
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    workingDirectory: $(terraformWorkingDirectory)
                    addSpnToEnvironment: true
                    visibleAzLogin: false
                    inlineScript: |
                      set -euo pipefail
                      export ARM_CLIENT_ID="$servicePrincipalId"
                      export ARM_TENANT_ID="$tenantId"
                      export ARM_SUBSCRIPTION_ID="$(az account show --query id --output tsv)"
                      export ARM_OIDC_TOKEN="$idToken"
                      export ARM_USE_OIDC=true
                      terraform init -reconfigure -input=false -no-color

                - bash: terraform validate -no-color
                  displayName: Terraform validate
                  workingDirectory: $(terraformWorkingDirectory)

                - bash: |
                    set -euo pipefail
                    docker run --rm \
                      --volume "$(Build.SourcesDirectory):/workspace:ro" \
                      "$(checkovImage)" \
                      --directory /workspace/terraform \
                      --quiet \
                      --soft-fail
                  displayName: Checkov IaC scan (informational)

                - task: AzureCLI@2
                  displayName: Terraform plan
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    workingDirectory: $(terraformWorkingDirectory)
                    addSpnToEnvironment: true
                    visibleAzLogin: false
                    inlineScript: |
                      set -euo pipefail
                      export ARM_CLIENT_ID="$servicePrincipalId"
                      export ARM_TENANT_ID="$tenantId"
                      export ARM_SUBSCRIPTION_ID="$(az account show --query id --output tsv)"
                      export ARM_OIDC_TOKEN="$idToken"
                      export ARM_USE_OIDC=true
                      terraform plan \
                        -input=false \
                        -lock-timeout=5m \
                        -no-color \
                        -out="$(terraformPlanPath)"

                - task: AzureCLI@2
                  displayName: Terraform apply saved plan
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    workingDirectory: $(terraformWorkingDirectory)
                    addSpnToEnvironment: true
                    visibleAzLogin: false
                    inlineScript: |
                      set -euo pipefail
                      export ARM_CLIENT_ID="$servicePrincipalId"
                      export ARM_TENANT_ID="$tenantId"
                      export ARM_SUBSCRIPTION_ID="$(az account show --query id --output tsv)"
                      export ARM_OIDC_TOKEN="$idToken"
                      export ARM_USE_OIDC=true
                      terraform apply \
                        -input=false \
                        -lock-timeout=5m \
                        -no-color \
                        "$(terraformPlanPath)"

                - task: AzureCLI@2
                  displayName: Verify idempotent second plan
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    workingDirectory: $(terraformWorkingDirectory)
                    addSpnToEnvironment: true
                    visibleAzLogin: false
                    inlineScript: |
                      set -euo pipefail
                      export ARM_CLIENT_ID="$servicePrincipalId"
                      export ARM_TENANT_ID="$tenantId"
                      export ARM_SUBSCRIPTION_ID="$(az account show --query id --output tsv)"
                      export ARM_OIDC_TOKEN="$idToken"
                      export ARM_USE_OIDC=true

                      set +e
                      terraform plan \
                        -detailed-exitcode \
                        -input=false \
                        -lock-timeout=5m \
                        -no-color
                      plan_exit_code=$?
                      set -e

                      if [[ $plan_exit_code -eq 2 ]]; then
                        echo '##vso[task.logissue type=error]Terraform detected changes immediately after apply.'
                        exit 1
                      fi
                      if [[ $plan_exit_code -ne 0 ]]; then
                        echo "##vso[task.logissue type=error]Terraform plan failed with exit code $plan_exit_code."
                        exit "$plan_exit_code"
                      fi
                      echo 'Terraform is idempotent: no changes after apply.'

                - bash: |
                    set -euo pipefail
                    rm -f "$(terraformPlanPath)"
                  displayName: Remove local saved plan
                  condition: always()
