apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml

# backend-secrets (ConnectionStrings__Default, Tmdb__ApiKey) is intentionally NOT
# here — it is created imperatively by the CD pipeline from GitHub Secrets, so no
# secret value is ever committed. See .github/workflows/deploy.yml.
