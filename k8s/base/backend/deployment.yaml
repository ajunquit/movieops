apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: movieops
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movieops
      tier: backend
  template:
    metadata:
      labels:
        app: movieops
        tier: backend
    spec:
      containers:
        - name: backend
          image: placeholder/movieops-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: '8080'
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
