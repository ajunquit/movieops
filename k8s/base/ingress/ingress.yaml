apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: movieops
spec:
  # Azure's managed NGINX addon (enabled in the kubernetes Terraform module
  # via web_app_routing) registers this class.
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
    - http:
        paths:
          # No rewrite: the backend already expects requests under /api,
          # same as nginx.conf's proxy_pass in the docker-compose setup.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
