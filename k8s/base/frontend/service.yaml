apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: movieops
    tier: frontend
spec:
  # ClusterIP: the Ingress (k8s/base/ingress) is now the single external entry
  # point, replacing the Sprint 8 LoadBalancer Service.
  type: ClusterIP
  selector:
    app: movieops
    tier: frontend
  ports:
    - port: 80
      targetPort: 80
