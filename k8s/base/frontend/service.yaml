apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: movieops
    tier: frontend
spec:
  # LoadBalancer for now (Sprint 8: keep it simple). Becomes an Ingress in Sprint 9,
  # once we've actually covered Ingress as a concept rather than skipped straight to it.
  type: LoadBalancer
  selector:
    app: movieops
    tier: frontend
  ports:
    - port: 80
      targetPort: 80
