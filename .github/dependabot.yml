version: 2
updates:
  - package-ecosystem: 'nuget'
    directory: '/app/backend'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'npm'
    directory: '/app/frontend'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'docker'
    directories:
      - '/app/backend'
      - '/app/frontend'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
