name: 'Setup & Build Angular'
description: 'Sets up Node, installs dependencies with npm ci and builds the Angular app'

inputs:
  working-directory:
    description: 'Path to the Angular project (contains package.json)'
    required: true
  node-version:
    description: 'Node.js version'
    required: false
    default: '22'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    - name: Build (production)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx ng build --configuration production
