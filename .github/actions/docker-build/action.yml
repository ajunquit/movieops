name: 'Build & Push Docker Image'
description: 'Builds a Docker image with Buildx, tags it with the git SHA (immutable, traceable), and optionally pushes it'

inputs:
  context:
    description: 'Docker build context'
    required: true
  dockerfile:
    description: 'Path to the Dockerfile'
    required: true
  image-name:
    description: 'Image name, without registry (e.g. owner/movieops-api)'
    required: true
  registry:
    description: 'Container registry'
    required: false
    default: 'ghcr.io'
  push:
    description: "'true' to push, 'false' to only build (e.g. for PR validation)"
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Compute short SHA
      id: vars
      shell: bash
      run: echo "short_sha=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@v3

    - name: Log in to ${{ inputs.registry }}
      if: inputs.push == 'true'
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push }}
        tags: |
          ${{ inputs.registry }}/${{ inputs.image-name }}:sha-${{ steps.vars.outputs.short_sha }}
          ${{ inputs.registry }}/${{ inputs.image-name }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
