name: Genesis (Create Infrastructure)

# The creation counterpart to apocalipsis.yml (destroy). Manual-only, on
# purpose: this provisions real cloud infrastructure and costs real money.
# Same safety pattern as apocalipsis.yml — typed confirmation + the
# per-environment GitHub Environment gate (production requires a reviewer).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to create'
        type: choice
        options: [dev, staging, production]
        required: true
      confirm:
        description: 'Type the environment name exactly to confirm'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  create:
    name: Create ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: terraform/environments/azure/${{ inputs.environment }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
    steps:
      - name: Verify typed confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "${{ inputs.environment }}" ]; then
            echo "::error::You typed '${{ inputs.confirm }}', which does not match the selected environment '${{ inputs.environment }}'. Aborting without touching anything."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Check this environment has a Terraform config
        run: |
          if [ ! -f main.tf ]; then
            echo "::error::terraform/environments/azure/${{ inputs.environment }} has no Terraform config yet."
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      # Fail Fast: cheap checks before anything that touches Azure.
      - name: Terraform fmt
        run: terraform fmt -check -recursive ../../../

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Checkov (IaC security scan)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          quiet: true
          soft_fail: true # informational for this lab; flip to false to hard-block on findings

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan
