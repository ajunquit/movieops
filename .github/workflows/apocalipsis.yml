name: Apocalipsis (Destroy Infrastructure)

# Manual-only, on purpose: this destroys real cloud infrastructure. Never
# triggered by push/schedule. Production is additionally gated by a
# required-reviewer rule on the "production" GitHub Environment.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy'
        type: choice
        options: [dev, staging, production]
        required: true
      confirm:
        description: 'Type the environment name exactly to confirm'
        type: string
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: Destroy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: terraform/environments/azure/${{ inputs.environment }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
    steps:
      - name: Verify typed confirmation
        # Runs before checkout on purpose (fail before doing anything), so it
        # must override the job's working-directory — that path doesn't exist
        # until the repo is cloned.
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ inputs.confirm }}" != "${{ inputs.environment }}" ]; then
            echo "::error::You typed '${{ inputs.confirm }}', which does not match the selected environment '${{ inputs.environment }}'. Aborting without touching anything."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Check this environment has a Terraform config
        id: check
        run: |
          if [ ! -f main.tf ]; then
            echo "::warning::terraform/environments/azure/${{ inputs.environment }} has no Terraform config yet — nothing to destroy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Terraform authenticates directly through the ARM_* OIDC variables.
      # Azure CLI gets its own federated session so the final assertion can
      # prove that the environment resource group no longer exists.
      - name: Azure login for post-destroy verification
        if: steps.check.outputs.skip == 'false'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        if: steps.check.outputs.skip == 'false'
        run: terraform init

      - name: Terraform plan (destroy)
        if: steps.check.outputs.skip == 'false'
        run: terraform plan -destroy -out=destroy.tfplan

      - name: Terraform destroy
        if: steps.check.outputs.skip == 'false'
        run: terraform apply -auto-approve destroy.tfplan

      - name: Verify complete environment deletion
        if: steps.check.outputs.skip == 'false'
        working-directory: ${{ github.workspace }}
        run: |
          resource_group="rg-movieops-${{ inputs.environment }}"

          # Resource Group deletion is asynchronous in Azure. Terraform
          # normally waits for it, but this bounded poll makes the pipeline's
          # contract explicit: success means the whole environment is gone.
          for attempt in {1..30}; do
            if [ "$(az group exists --name "$resource_group")" = "false" ]; then
              echo "Resource group '$resource_group' was completely deleted."
              exit 0
            fi

            echo "Waiting for '$resource_group' to disappear ($attempt/30)..."
            sleep 10
          done

          echo "::error::Resource group '$resource_group' still exists after Terraform destroy."
          az resource list --resource-group "$resource_group" --output table || true
          exit 1
