name: CD - Staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to promote, e.g. sha-abc1234 (must already be validated in dev)"
        required: true
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    permissions:
      id-token: write
      contents: read
    with:
      environment: staging
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
